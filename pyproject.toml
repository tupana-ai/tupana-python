[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tupana"
dynamic = ["version"]
description = "SDK oficial de Tupana para Python: facturación electrónica SII, cobros, cesiones y webhooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tupana", email = "developers@tupana.ai" }]
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.25,<1",
  "typing-extensions>=4.7",
]
keywords = ["tupana", "sii", "chile", "dte", "facturacion-electronica", "factura", "boleta", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://docs.tupana.ai"
Documentation = "https://docs.tupana.ai"
Repository = "https://github.com/tupana-ai/tupana-python"
Issues = "https://github.com/tupana-ai/tupana-python/issues"
Changelog = "https://github.com/tupana-ai/tupana-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.hatch.version]
path = "src/tupana/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tupana"]

[tool.hatch.build.targets.sdist]
include = ["src/tupana", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/tupana"]
